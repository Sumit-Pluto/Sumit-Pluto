name: Generate Metrics

on:
  schedule:
    - cron: "0 * * * *" # hourly — keeps stars/commits/contributions fresh
  workflow_dispatch: {} # run manually from the Actions tab
  # NOTE: no `push` trigger on purpose — this Action commits metrics.svg back to
  # the repo, and a push trigger would make it loop.

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Sumit-Pluto
          filename: metrics.svg
          template: terminal # dark, robotic aesthetic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_message: "chore: update metrics.svg"
