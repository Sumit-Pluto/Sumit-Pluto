name: Generate Pac-Man

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch: {} # run manually from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Collect whatever the action produced into dist/ (robust to its output path)
      - name: Collect SVG into dist
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE" -maxdepth 4 -iname '*pacman*.svg' -not -path '*/dist/*' -exec cp {} dist/ \; || true
          echo "generated files:"; ls -la dist || true

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The README points at:
#   .../output/pacman-contribution-graph.svg
# After the first run, open the `output` branch and confirm the exact filename;
# if it differs, update the <img src> in README.md to match.
